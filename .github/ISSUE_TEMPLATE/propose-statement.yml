name: Propose a statement
description: Suggest a new OT task, knowledge or skill statement.
title: "[statement] "
labels: ["proposal", "statement"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [task, knowledge, skill]
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Proposed wording
      description: Follow NICE style, e.g. "Knowledge of ...", "Skill in ...", or an imperative task ("Maintain ...").
    validations:
      required: true
  - type: input
    id: roles
    attributes:
      label: Roles it belongs to
      description: Plus role IDs (PR-OT-###), with core or additional for each
  - type: input
    id: nice
    attributes:
      label: Closest NICE statements
      description: NICE IDs this refines or complements, if any. If NICE already covers it, say why it is still needed.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Public sources with section/page. For copyrighted standards give part and clause only.
    validations:
      required: true
  - type: input
    id: attack
    attributes:
      label: ATT&CK for ICS techniques (optional)
      description: e.g. T0889, T1692.001
  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: AI-assisted reviews are welcome. Please say how this was produced.
      options:
        - None, written by a person
        - AI-assisted, reviewed by a person before submitting
        - Mostly generated by an AI agent, reviewed by a person
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or model used (if any)
      description: e.g. Claude Code with Claude Opus 5.5, Codex, Copilot
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests for duplicates
          required: true
        - label: Every source I cite was actually opened and checked (or is marked as not checked)
          required: true
        - label: I did not paste text from copyrighted standards
          required: true
