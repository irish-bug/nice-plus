name: Propose or flesh out a role
description: Suggest a new OT/ICS work role, or statements for a stub role.
title: "[role] "
labels: ["proposal", "role"]
body:
  - type: input
    id: role
    attributes:
      label: Role title (or existing stub ID)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What the role does, and who holds it in practice
    validations:
      required: true
  - type: input
    id: nice
    attributes:
      label: NICE roles it builds on
      description: e.g. PD-WRL-003, DD-WRL-009
  - type: textarea
    id: statements
    attributes:
      label: Key statements
      description: NICE IDs and/or proposed new statements, with core or additional
  - type: textarea
    id: sources
    attributes:
      label: Sources
  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: AI-assisted reviews are welcome. Please say how this was produced.
      options:
        - None, written by a person
        - AI-assisted, reviewed by a person before submitting
        - Mostly generated by an AI agent, reviewed by a person
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or model used (if any)
      description: e.g. Claude Code with Claude Opus 5.5, Codex, Copilot
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests for duplicates
          required: true
        - label: Every source I cite was actually opened and checked (or is marked as not checked)
          required: true
        - label: I did not paste text from copyrighted standards
          required: true
