name: Suggest a source
description: A public, citable source NICE Plus should use (guidance, profiles, job task analyses, research).
title: "[source] "
labels: ["source"]
body:
  - type: input
    id: title
    attributes:
      label: Title, publisher, version and date
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it would support
      description: Which roles, statements or gaps it would help with, with section or page references.
    validations:
      required: true
  - type: dropdown
    id: licence
    attributes:
      label: Licence or reuse terms
      options:
        - US Government work (public domain in the US)
        - Open licence (e.g. CC BY)
        - Copyrighted; cite and paraphrase only
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: AI-assisted reviews are welcome. Please say how this was produced.
      options:
        - None, written by a person
        - AI-assisted, reviewed by a person before submitting
        - Mostly generated by an AI agent, reviewed by a person
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or model used (if any)
      description: e.g. Claude Code with Claude Opus 5.5, Codex, Copilot
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests for duplicates
          required: true
        - label: Every source I cite was actually opened and checked (or is marked as not checked)
          required: true
        - label: I did not paste text from copyrighted standards
          required: true
