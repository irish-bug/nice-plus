name: Challenge a statement or role
description: Something is wrong, missing, mis-flagged, mis-cited or badly worded.
title: "[challenge] "
labels: ["challenge"]
body:
  - type: input
    id: target
    attributes:
      label: Statement or role ID
      description: e.g. PT-OT-0002, PR-OT-004, or a NICE ID linked to a role (say which role)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - Wording is wrong or unclear
        - Does not belong in this role
        - Should be core / additional (flag is wrong)
        - Citation does not support it, or locator is wrong
        - Duplicates a NICE statement or another plus statement
        - Missing ATT&CK for ICS link, or wrong link
        - Other
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details and suggested fix
      description: Point to public sources where you can. Please do not paste text from copyrighted standards; cite the part and clause instead.
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI assistance
      description: AI-assisted reviews are welcome. Please say how this was produced.
      options:
        - None, written by a person
        - AI-assisted, reviewed by a person before submitting
        - Mostly generated by an AI agent, reviewed by a person
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or model used (if any)
      description: e.g. Claude Code with Claude Opus 5.5, Codex, Copilot
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests for duplicates
          required: true
        - label: Every source I cite was actually opened and checked (or is marked as not checked)
          required: true
        - label: I did not paste text from copyrighted standards
          required: true
